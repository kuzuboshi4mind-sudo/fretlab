<!doctype html><html><head><meta charset="utf-8">
<!-- アプリアイコンの原画。tools/render_icon.js で assets/icon-master*.png に書き出す -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">
<style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
.i{width:1024px;height:1024px;background:#f4f3ee;position:relative}
svg{position:absolute;inset:0}
</style></head><body><div class="i"><svg viewBox="0 0 1024 1024" id="s"></svg></div>
<script>
const mask=location.hash==='#mask', k=mask?0.78:1, o=512*(1-k);
const g=(x)=>o+x*k;
let s=`<g transform="translate(${o} ${o}) scale(${k})">`;
// 6本の弦（下ほど太い）とフレット
for(let i=0;i<6;i++){const y=300+i*84; s+=`<line x1="120" y1="${y}" x2="904" y2="${y}" stroke="#161816" stroke-opacity=".22" stroke-width="${2+i*1.3}"/>`;}
[[150,10],[392,4],[640,4],[874,4]].forEach(([x,w])=>s+=`<line x1="${x}" y1="260" x2="${x}" y2="760" stroke="#161816" stroke-opacity="${w>5?.85:.25}" stroke-width="${w}"/>`);
// 上品なセリフ体の F
s+=`<text x="512" y="700" text-anchor="middle" font-family="Cormorant Garamond" font-weight="500" font-size="600" fill="#161816">F</text>`;
// ルート音のドット（金茶）
s+=`<circle cx="757" cy="468" r="42" fill="#8a6d3b"/>`;
// 小さな葉の枝（セージ）
s+=`<g fill="none" stroke="#7f9a83" stroke-width="7" stroke-linecap="round"><path d="M226 840 C300 790 360 770 452 772"/>
<path d="M290 806 c-18 -40 4 -78 40 -88 c10 42 -6 74 -40 88z"/><path d="M350 784 c0 -44 30 -72 66 -72 c-2 42 -26 66 -66 72z"/>
<path d="M300 812 c-40 -6 -70 16 -76 46 c38 8 64 -12 76 -46z"/><path d="M372 786 c-36 10 -54 40 -50 68 c34 -4 52 -32 50 -68z"/></g>`;
s+='</g>';
document.getElementById('s').innerHTML=s;
</script></body></html>
