<!doctype html><html><head><meta charset="utf-8">
<!-- アプリアイコンの原画（オープニングと同じ線画のギター＋ロゴ）。tools/render_icon.js で assets/icon-master*.png に書き出す -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&display=swap">
<style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
.i{width:1024px;height:1024px;position:relative;background:#f1f1ee url(../site/img/paper.jpg) center 40%/cover no-repeat}
svg{position:absolute;inset:0}
</style></head><body><div class="i"><svg viewBox="0 0 1024 1024" id="s"></svg></div>
<script>
const mask=location.hash==='#mask', k=mask?0.8:1, o=512*(1-k);
// ギターの座標はオープニング（viewBox 200×342）と同じ。アイコン用に線を太くする
const GS=2.05, gx=512-100*GS, gy=96;
const gold='url(#gold)', cob='#2f5fc4';
let s=`<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a256"/><stop offset="1" stop-color="#8f6a26"/></linearGradient>
  <linearGradient id="cob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d7ad8"/><stop offset="1" stop-color="#1f4bb0"/></linearGradient>
  <linearGradient id="goldt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a256"/><stop offset="1" stop-color="#9a722b"/></linearGradient>
</defs><g transform="translate(${o} ${o}) scale(${k})"><g transform="translate(${gx} ${gy}) scale(${GS})" fill="none" stroke-linecap="round" stroke-linejoin="round">`;
const ln=(d,w=3.2)=>s+=`<path d="${d}" stroke="${gold}" stroke-width="${w}"/>`;
ln('M100 122 C128 120 156 132 156 162 C156 186 144 196 146 210 C148 226 172 238 172 272 C172 312 140 332 100 332 C60 332 28 312 28 272 C28 238 52 226 54 210 C56 196 44 186 44 162 C44 132 72 120 100 122 Z');
s+=`<circle cx="100" cy="196" r="18" stroke="${gold}" stroke-width="3.2"/><circle cx="100" cy="196" r="23" stroke="${gold}" stroke-width="1.6"/>`;
ln('M93 124 L93 40 L90 6 Q100 1 110 6 L107 40 L107 124');
ln('M92 40 L108 40',2.4);
[56,72,86,99,111].forEach(y=>ln(`M93 ${y} L107 ${y}`,1.4));
[[84,12],[84,22],[84,32],[116,12],[116,22],[116,32]].forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="3" stroke="${gold}" stroke-width="2.2"/>`);
ln('M82 284 L118 284 L118 290 L82 290 Z',2.6);
for(let i=0;i<6;i++) s+=`<path d="M${94.6+i*2.16} 40 L${89+i*4.4} 287" stroke="url(#cob)" stroke-width="${0.9+i*0.1}"/>`;
s+=`</g>`;
// ロゴ（アプリ上部と同じ：FRET＝コバルト、LAB＝金）
s+=`<text x="525" y="902" text-anchor="middle" font-family="Shippori Mincho" font-weight="700" font-size="92" letter-spacing="26"><tspan fill="url(#cob)">FRET</tspan><tspan fill="url(#goldt)">LAB</tspan></text>`;
s+='</g>';
document.getElementById('s').innerHTML=s;
</script></body></html>
